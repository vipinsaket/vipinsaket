-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="26" fill="#8ab4ff" opacity="0.18">=&gt;<animate attributeName="opacity" values="0.08;0.34;0.08" dur="6.5s" begin="1.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.5s" begin="1.8s" repeatCount="indefinite"/></text><text x="1130" y="160" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="28" fill="#8ab4ff" opacity="0.18">[ ]<animate attributeName="opacity" values="0.08;0.34;0.08" dur="8.5s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="8.5s" begin="0.9s" repeatCount="indefinite"/></text><text x="60" y="165" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="24" fill="#8ab4ff" opacity="0.18">&amp;&amp;<animate attributeName="opacity" values="0.08;0.34;0.08" dur="7.0s" begin="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7.0s" begin="2.6s" repeatCount="indefinite"/></text><text x="760" y="285" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="28" fill="#8ab4ff" opacity="0.18">#<animate attributeName="opacity" values="0.08;0.34;0.08" dur="6.0s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.0s" begin="1.1s" repeatCount="indefinite"/></text><text x="420" y="292" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="24" fill="#8ab4ff" opacity="0.18">//<animate attributeName="opacity" values="0.08;0.34;0.08" dur="8.0s" begin="3.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="8.0s" begin="3.4s" repeatCount="indefinite"/></text>
    <g>
      <circle cx="38" cy="34" r="6" fill="#ff5f56"/><circle cx="60" cy="34" r="6" fill="#ffbd2e"/><circle cx="82" cy="34" r="6" fill="#27c93f"/>
    </g>
    <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="5" fill="url(#ttl)" filter="url(#glow)" opacity="0.65">VIPIN KUMAR SAKET</text>
    <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="5" fill="url(#ttl)">VIPIN KUMAR SAKET
      <animate attributeName="opacity" values="0;1" dur="1.3s" fill="freeze"/>
    </text>
    <rect x="380" y="172" width="440" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="width" values="0;440" dur="1.6s" fill="freeze"/>
    </rect>
    <text x="600" y="218" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" letter-spacing="3" fill="#b6c6ee">SOFTWARE DEVELOPER  •  JAVA  •  FULL-STACK  •  AI
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="600" y="256" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="16" letter-spacing="2" fill="#00d4ff">Indore, India<tspan fill="#ffffff">_</tspan>
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.9s" fill="freeze"/>
    </text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="url(#ttl)" stroke-width="2" opacity="0.7"/>
</svg>
