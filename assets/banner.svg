<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Vipin Kumar Saket, Software Developer, Java, Full-Stack and AI enthusiast, Indore, India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#150f3d"/><stop offset="1" stop-color="#042533"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff3cac"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4c6fff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="180" cy="90" r="130" fill="#7b2ff7" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;230;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="230" r="150" fill="#00d4ff" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cx" values="1020;780;1020" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;80;230" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="320" r="110" fill="#ff3cac" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="620;840;380;620" dur="18s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#bar)" opacity="0.75">
      <animate attributeName="y" values="-4;324" dur="5.5s" repeatCount="indefinite"/>
    </rect>
