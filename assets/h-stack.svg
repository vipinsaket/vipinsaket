<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="Tech Stack">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff3cac"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="300" y="6" width="5" height="46" rx="2.5" fill="url(#t)"/>
  <text x="320" y="22" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#6e7fa8" letter-spacing="2">// 02 · what I use</text>
  <text x="320" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" fill="url(#t)">Tech Stack</text>
  <rect x="320" y="66" width="0" height="3" rx="1.5" fill="url(#t)">
    <animate attributeName="width" values="0;260" dur="1.4s" fill="freeze"/>
  </rect>
</svg>
