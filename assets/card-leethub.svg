<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="Project: LeetHub 2.0  (fork)">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="0.5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff3cac"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1530"/><stop offset="1" stop-color="#0a0e1f"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cl"><rect x="3" y="3" width="554" height="204" rx="16"/></clipPath>
  </defs>
  <rect x="3" y="3" width="554" height="204" rx="16" fill="url(#bgc)"/>
  <g clip-path="url(#cl)">
    <rect x="-200" y="0" width="160" height="210" fill="url(#sh)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;760" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="3" y="3" width="554" height="204" rx="16" fill="none" stroke="url(#b)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M30 28h9l3 4h13a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H30a2 2 0 0 1-2-2V30a2 2 0 0 1 2-2z" fill="none" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="70" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">LeetHub 2.0  (fork)</text>
  <circle cx="30" cy="82" r="0" fill="#f7df1e"/>
  <text x="30" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#aab6d3">Browser extension that automatically syncs accepted</text><text x="30" y="115" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#aab6d3">LeetCode solutions to GitHub. Forked and kept working</text><text x="30" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#aab6d3">with updates.</text>
  <rect x="30" y="164" width="96" height="26" rx="13" fill="#1b2340" stroke="#2f3b6b"/><text x="78.0" y="181" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#cfe0ff">JavaScript</text><rect x="134" y="164" width="73" height="26" rx="13" fill="#1b2340" stroke="#2f3b6b"/><text x="170.5" y="181" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#cfe0ff">Webpack</text><rect x="215" y="164" width="140" height="26" rx="13" fill="#1b2340" stroke="#2f3b6b"/><text x="285.0" y="181" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#cfe0ff">Chrome / Firefox</text>
  <text x="530" y="181" text-anchor="end" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5" fill="#00d4ff">view repo →
