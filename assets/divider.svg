<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Decorative animated divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/><stop offset="0.25" stop-color="#00d4ff"/>
      <stop offset="0.75" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff3cac" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <rect x="40" y="11" width="920" height="2" rx="1" fill="url(#d)" opacity="0.8"/>
  <circle r="5" cy="12" fill="#ffffff" filter="url(#g)">
    <animate attributeName="cx" values="40;960;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" cy="12" fill="#ffffff">
    <animate attributeName="cx" values="40;960;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M500 4l8 8-8 8-8-8z" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 500 12;360 500 12" dur="9s" repeatCount="indefinite"/>
  </path>
</svg>
